<!DOCTYPE html>
<html>
<head>
    <title>TRACTOR Transport Tracking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<div class="header">
    <h1>🚜 TRACTOR Transport Tracking Portal</h1>
    <p>Professional Vehicle Tracking System</p>
</div>

    <input type="text" id="phoneSearch" placeholder="Enter Mobile Number">
    <button onclick="searchCustomer()">Search</button>

    <div id="customerDetails" style="display:none; margin-top:20px;">
        <h2>Customer Details</h2>

        <p><b>Name :</b> <span id="customerName"></span></p>

        <p><b>Tractor :</b> <span id="tractorModel"></span></p>

        <p><b>Location :</b> <span id="tractorLocation"></span></p>

        <p><b>Status :</b> <span id="tractorStatus"></span></p>
        <h3>🚚 Transport Progress</h3>

<div class="timeline">
  <div class="step active">📄 Documents Verification</div>
  <div class="step">🔍 PDI Verification</div>
  <div class="step">🚛 Dispatch from Bangalore</div>
  <div class="step">🚚 In Transit</div>
  <div class="step">📍 Hubballi Yard</div>
  <div class="step">✅ Ready for Delivery</div>
</div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
